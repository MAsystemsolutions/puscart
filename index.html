<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Puscart</title>
<meta name="theme-color" content="#ffe4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Puscart">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
/* ================= PUSCART STYLES ================= */
:root{
  --bg:#ffe4ec; --bg2:#fff0f4; --blush:#ffc2cf; --rosas:#d94c6e; --rosas2:#b83a5a; --tang:#f59a3c; --tang2:#fff1e2;
  --teal:#2bb5a0; --teal2:#ddf5f0; --tealD:#1d8a7a; --ink:#3a2f5b; --ink2:#5b4f80; --gold:#ffd66b; --gold2:#fff6d9;
  --muted:#8a7ea8; --line:#f8d5df; --white:#fff; --cream:#fff8fa; --red:#e0475f; --red2:#ffe1e6;
  --r:20px; --shadow:0 2px 0 rgba(58,47,91,.06), 0 6px 18px rgba(217,76,110,.08);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safeb: env(safe-area-inset-bottom, 0px); --safet: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
button:focus{outline:none}button:focus-visible{outline:3px solid var(--blush)}
.muted{color:var(--muted)}
.small{font-size:13px}
.b{font-weight:800}
.mascot{display:block;width:100%;height:auto}

/* ---- layout ---- */
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + var(--safeb))}
#app.selling{padding-bottom:calc(170px + var(--safeb))}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 82%,rgba(255,228,236,0));padding:calc(10px + var(--safet)) 14px 8px;display:flex;align-items:center;gap:9px}
.top img{width:38px;height:38px;border-radius:12px}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.brand span{color:var(--rosas)}
.bizname{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tb{min-width:0;flex:1 1 auto;overflow:hidden}
.top>*{flex-shrink:0}.top .tb{flex-shrink:1}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--white);display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow);position:relative}
.sync{font-size:11px;font-weight:800;padding:6px 9px;max-width:104px;overflow:hidden;text-overflow:ellipsis;border-radius:99px;background:var(--white);box-shadow:var(--shadow);white-space:nowrap}
.sync.ok{color:var(--tealD)} .sync.wait{color:#b7791f} .sync.off{color:var(--muted)}
.demo-chip{font-size:10px;background:var(--gold);padding:2px 7px;border-radius:99px;font-weight:900;margin-left:4px;vertical-align:2px}
@media (max-width:400px){.top{gap:6px;padding-left:10px;padding-right:10px}.top img{width:32px;height:32px}.brand{font-size:17px}.iconbtn{width:36px;height:36px;font-size:17px}.sync{max-width:78px}}

.view{padding:2px 14px 14px;animation:fade .12s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
h2{font-size:21px;margin:8px 2px 12px;font-weight:900}
h3{font-size:15px;margin:16px 2px 8px;font-weight:900}
.card{background:var(--white);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}

/* ---- scan bar (Benta) ---- */
.scanbar{display:flex;gap:8px;align-items:center;margin:2px 0 10px}
.scanin{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--white);border-radius:18px;padding:0 12px;box-shadow:var(--shadow);border:2px solid transparent}
.scanin:focus-within{border-color:var(--blush)}
.scanin input{border:0;outline:0;background:transparent;padding:14px 0;width:100%;min-width:0;font-weight:800;font-size:16px}
.cambtn{width:58px;height:54px;border-radius:18px;background:var(--rosas);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 6px 14px rgba(217,76,110,.35);flex:none}
.cambtn:active,.btn:active,.qt:active,.chip:active,.iconbtn:active,.qbtn:active{transform:scale(.96)}
.sugg{background:var(--white);border-radius:18px;box-shadow:var(--shadow);margin:-4px 0 10px;overflow:hidden}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--line);text-align:left;font-weight:800}
.sugg button:last-child{border:0}
.sugg .p{margin-left:auto;color:var(--rosas);font-weight:900;white-space:nowrap}
.hello{display:flex;align-items:flex-end;gap:6px;margin:0 0 10px}
.hello .m{width:62px;flex:none}
.bubble{background:var(--white);border-radius:18px 18px 18px 6px;padding:10px 13px;box-shadow:var(--shadow);font-weight:800;font-size:14px;line-height:1.35}
.bubble small{display:block;font-weight:700;color:var(--muted);font-size:12px;margin-top:2px}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:12px}
.qt{background:var(--white);border-radius:18px;padding:10px 8px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:3px;min-height:72px;justify-content:center;position:relative}
.qt .n{font-weight:900;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qt .p{font-weight:900;font-size:13px;color:var(--rosas)}
.qt.add{background:var(--bg2);border:2px dashed var(--blush);box-shadow:none;color:var(--rosas2)}
.qt .badge{position:absolute;top:-5px;right:-5px}

.cart .ci{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.cart .ci:last-child{border:0}
.ci .nm{flex:1;min-width:0}
.ci .nm b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ci .nm span{font-size:12px;color:var(--muted);font-weight:700}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:14px;padding:3px}
.qty button{width:34px;height:34px;border-radius:11px;background:var(--white);font-weight:900;font-size:19px;box-shadow:var(--shadow)}
.qty span{min-width:30px;text-align:center;font-weight:900;font-size:16px}
.ci .lt{font-weight:900;min-width:76px;text-align:right;white-space:nowrap}
.ci.flash{animation:flash .5s ease}
@keyframes flash{0%{background:var(--gold2)}100%{background:transparent}}

.paybar{position:fixed;left:0;right:0;bottom:calc(70px + var(--safeb));z-index:25;display:flex;justify-content:center;pointer-events:none;padding:0 10px}
.paybar .in{pointer-events:auto;width:100%;max-width:540px;background:var(--ink);color:#fff;border-radius:22px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(58,47,91,.3)}
.paybar .t{flex:1;min-width:0}
.paybar .t small{display:block;font-size:12px;opacity:.8;font-weight:800}
.paybar .t b{font-size:24px;font-weight:900;letter-spacing:-.3px}
.paybar .go{background:var(--teal);color:#fff;font-weight:900;font-size:17px;border-radius:16px;padding:14px 18px;white-space:nowrap}
.paybar .clr{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.12);font-size:17px}
.paybar.empty .go{background:rgba(255,255,255,.18);color:rgba(255,255,255,.7)}

/* ---- chips / lists ---- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--white);font-weight:800;font-size:14px;box-shadow:var(--shadow);border:2px solid transparent;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.item{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--bg2)}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:900;white-space:nowrap;text-align:right}
.item .val small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.item.void .t1,.item.void .val{text-decoration:line-through;opacity:.55}
.dayhead{display:flex;justify-content:space-between;font-weight:900;font-size:13px;color:var(--muted);margin:14px 6px 6px}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-weight:800}
.empty .m{width:100px;margin:0 auto 8px}
.search{width:100%;padding:13px 15px;border-radius:16px;border:2px solid var(--line);background:var(--white);margin-bottom:10px;outline:0}
.search:focus{border-color:var(--blush)}
.badge{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--teal2);color:var(--tealD);white-space:nowrap}
.badge.low{background:var(--gold2);color:#a86b00}
.badge.out{background:var(--red2);color:var(--red)}
.tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--red2);color:var(--rosas)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.actrow{display:flex;gap:8px;margin-bottom:12px}
.actrow .btn{padding:13px 8px;font-size:15px}

/* ---- buttons / forms ---- */
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:900;font-size:17px;text-align:center;box-shadow:var(--shadow)}
.btn.main{background:var(--ink);color:#fff}
.btn.pink{background:var(--rosas);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.soft{background:var(--white);color:var(--ink)}
.btn.danger{background:var(--white);color:var(--red)}
.btn[disabled]{opacity:.5}
.field{margin-bottom:11px}
.field label{display:block;font-weight:900;font-size:13px;margin:0 4px 5px;color:var(--ink2)}
.field label small{font-weight:700;color:var(--muted)}
.inp{width:100%;padding:13px 14px;border-radius:15px;border:2px solid var(--line);background:var(--white);outline:0;font-weight:700}
.inp:focus{border-color:var(--blush)}
.inrow{display:flex;gap:8px}.inrow .inp{flex:1;min-width:0}
.inrow .sbtn{flex:none;width:52px;border-radius:15px;background:var(--rosas);color:#fff;font-size:22px}
.amtwrap{background:var(--white);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;margin-bottom:12px;border:2px solid transparent}
.amtwrap:focus-within{border-color:var(--blush)}
.amtwrap span{font-size:26px;font-weight:900;color:var(--muted)}
.amtwrap input{border:0;outline:0;font-size:32px;font-weight:900;width:100%;background:transparent;min-width:0}
.seg{display:flex;background:var(--white);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:11px 6px;border-radius:13px;font-weight:900;font-size:15px}
.seg button.on{background:var(--ink);color:#fff}
.cats{display:flex;flex-wrap:wrap;gap:7px}
.cat{padding:9px 12px;border-radius:14px;background:var(--white);font-weight:800;font-size:14px;border:2px solid transparent;box-shadow:var(--shadow)}
.cat.sel{border-color:var(--rosas);background:var(--bg2)}
.switch{width:52px;height:30px;border-radius:99px;background:#e8d9e0;position:relative;flex:none;transition:background .15s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.switch.on{background:var(--teal)}.switch.on:after{left:25px}
.lockbar{background:var(--gold2);border-radius:16px;padding:12px 14px;font-weight:800;font-size:14px;line-height:1.35;margin-bottom:12px}
.infobar{background:var(--bg2);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink2);margin:8px 0;line-height:1.4}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;background:rgba(58,47,91,.42);z-index:60;opacity:0;transition:opacity .15s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:560px;background:var(--cream);border-radius:26px 26px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(18px + var(--safeb));transform:translateY(100%);transition:transform .18s ease-out;-webkit-overflow-scrolling:touch}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#efc6d2;margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0}
.x{width:40px;height:40px;border-radius:14px;background:var(--white);font-size:20px;font-weight:900;box-shadow:var(--shadow);flex:none}
.opts{display:grid;gap:9px}
.opt{background:var(--white);border-radius:18px;padding:14px 15px;font-weight:900;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);border:3px solid transparent;width:100%}
.opt .e{font-size:26px}
.opt.sel{border-color:var(--rosas);background:var(--bg2)}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:700}

/* ---- pay ---- */
.paytot{text-align:center;background:var(--ink);color:#fff;border-radius:22px;padding:14px;margin-bottom:12px}
.paytot small{display:block;font-weight:800;opacity:.8;font-size:13px}
.paytot b{font-size:38px;font-weight:900;letter-spacing:-.5px}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qbtn{background:var(--white);border-radius:15px;padding:12px 4px;font-weight:900;box-shadow:var(--shadow);font-size:15px}
.qbtn.exact{background:var(--teal2);color:var(--tealD)}
.change{display:flex;justify-content:space-between;align-items:center;background:var(--gold2);border-radius:18px;padding:12px 16px;margin-bottom:12px;font-weight:900}
.change b{font-size:28px}
.change.short{background:var(--red2);color:var(--red)}
.receipt{background:#fff;border-radius:16px;padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;box-shadow:var(--shadow);margin-bottom:12px}
.receipt .c{text-align:center}
.receipt .rw{display:flex;justify-content:space-between;gap:10px}
.receipt hr{border:0;border-top:1px dashed #bbb;margin:6px 0}

/* ---- scanner ---- */
.scanner{position:fixed;inset:0;z-index:90;background:#120d1f;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .shade{position:absolute;inset:0;pointer-events:none}
.scanner .box{position:absolute;left:8%;right:8%;top:38%;height:22%;border-radius:22px;box-shadow:0 0 0 9999px rgba(18,13,31,.55);border:3px solid rgba(255,255,255,.9)}
.scanner .box.hit{border-color:var(--teal);box-shadow:0 0 0 9999px rgba(18,13,31,.55),0 0 0 6px rgba(43,181,160,.5)}
.scanner .laser{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--rosas);box-shadow:0 0 8px var(--rosas);animation:laser 1.6s ease-in-out infinite}
@keyframes laser{0%,100%{transform:translateY(-28px)}50%{transform:translateY(28px)}}
.scanner .sbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safet)) 14px 10px;color:#fff}
.scanner .sbar b{flex:1;font-size:17px}
.scanner .sbtn2{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-size:20px;display:grid;place-items:center}
.scanner .foot{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 14px calc(16px + var(--safeb));display:flex;flex-direction:column;gap:10px}
.scanner .tip{display:flex;align-items:flex-end;gap:8px}
.scanner .tip .m{width:64px;flex:none}
.scanner .tip .bubble{font-size:14px}
.scanner .last{background:rgba(255,255,255,.95);border-radius:16px;padding:10px 14px;font-weight:900;display:flex;justify-content:space-between;gap:10px}

/* ---- full screens ---- */
.screen{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(16px + var(--safet)) 18px calc(18px + var(--safeb))}
.screen .inner{width:100%;max-width:460px;display:flex;flex-direction:column;flex:1}
.wz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:#fff;opacity:.85}
.dots i.on{background:var(--rosas);width:22px}
.wz-m{width:140px;margin:6px auto 0}
.wz-q{background:var(--white);border-radius:24px;padding:15px 18px;box-shadow:var(--shadow);font-weight:900;font-size:19px;line-height:1.3;text-align:center;margin:10px 0 14px;position:relative}
.wz-q:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--white)}
.wz-q small{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
.wz-foot{margin-top:auto;padding-top:16px;display:flex;gap:10px}
.wz-input{width:100%;padding:15px;border-radius:20px;border:3px solid var(--white);background:var(--white);font-size:20px;font-weight:800;text-align:center;outline:0;box-shadow:var(--shadow)}
.wz-input:focus{border-color:var(--blush)}
.inst-step{display:flex;gap:12px;align-items:flex-start;background:var(--white);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;font-weight:700;line-height:1.35}
.inst-step .n{width:30px;height:30px;border-radius:10px;background:var(--rosas);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.kbd{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border-radius:8px;padding:1px 7px;font-weight:900;white-space:nowrap}
.pointer{position:fixed;z-index:90;font-size:52px;animation:bounce 1s infinite;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.pointer.bc{bottom:calc(6px + var(--safeb));left:50%;margin-left:-26px}
.pointer.br{bottom:calc(6px + var(--safeb));right:14px}
.pointer.tr{top:calc(4px + var(--safet));right:10px;animation-name:bounceUp}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes bounceUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---- tour ---- */
.blk{position:fixed;z-index:100;background:transparent}
.ring{position:fixed;z-index:101;border-radius:18px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px rgba(40,26,60,.62);pointer-events:none;transition:all .2s ease}
.coach{position:fixed;z-index:102;left:16px;right:16px;margin:0 auto;max-width:420px;background:var(--white);border-radius:22px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;transition:top .2s ease}
.coach .m{width:56px;flex:none}
.coach .txt{font-weight:800;line-height:1.35;font-size:15px}
.coach .act{display:flex;gap:8px;margin-top:10px;align-items:center}
.coach .act .go{background:var(--rosas);color:#fff;border-radius:12px;padding:9px 16px;font-weight:900}
.coach .act .skip{font-size:12px;color:var(--muted);font-weight:800;margin-left:auto}
.coach .stepn{font-size:11px;color:var(--muted);font-weight:800}

/* ---- owner / log ---- */
.belln{position:absolute;top:-5px;right:-5px;background:var(--rosas);color:#fff;border-radius:99px;font-size:11px;font-weight:900;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.role{font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--bg2);color:var(--ink2);margin-left:4px;vertical-align:1px}
.role.owner{background:var(--teal2);color:var(--tealD)}
.pinbox{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}

.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px dashed var(--line);font-weight:800}
.set:last-child{border:0}
.set .muted{font-weight:700;font-size:13px}
.set button.lnk{color:var(--rosas2);font-weight:900;background:var(--bg2);padding:8px 12px;border-radius:12px;font-size:14px;white-space:nowrap}
.log{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.log .av{width:36px;height:36px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-weight:900;flex:none}
.log .t1{font-weight:800;font-size:14px}
.log .t2{font-size:12px;color:var(--muted);font-weight:700}
.alertcard{display:flex;align-items:center;gap:10px;background:var(--gold2);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px;font-weight:800;width:100%;text-align:left}

/* ---- reports ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:var(--r);padding:13px;box-shadow:var(--shadow);background:var(--white);min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.stat .lbl{font-weight:900;font-size:13px}
.stat .amt{font-weight:900;font-size:21px;letter-spacing:-.3px;margin-top:6px;word-break:break-all}
.stat .sub{font-size:12px;font-weight:700;color:var(--muted)}
.stat.big{grid-column:1/-1;background:var(--ink);color:#fff}.stat.big .sub{color:#d9d2ee}
.stat.t{background:var(--teal2)} .stat.g{background:var(--gold2)} .stat.p{background:var(--bg2)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;border-radius:5px 5px 2px 2px;min-height:2px;background:var(--rosas)}
.barlbl{display:flex;gap:3px;font-size:9px;color:var(--muted);font-weight:800}
.barlbl span{flex:1;text-align:center}
.hbar{margin:9px 0}
.hbar .h{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px;margin-bottom:4px}
.hbar .h span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:11px;border-radius:9px;background:var(--bg2);overflow:hidden}
.hbar .fill{height:100%;border-radius:9px;background:var(--rosas)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 2px;border-bottom:1px dashed var(--line);vertical-align:top}
.tbl td.r{text-align:right;font-weight:800;white-space:nowrap}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safeb));transform:translateX(-50%) translateY(16px);z-index:120;background:var(--white);border-radius:20px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(58,47,91,.25);font-weight:900;opacity:0;transition:all .18s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .m{width:44px;flex:none}
#app.selling~.toast{bottom:calc(176px + var(--safeb))}

/* ---- bottom nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:560px;background:var(--white);border-radius:24px 24px 0 0;box-shadow:0 -6px 22px rgba(217,76,110,.12);display:flex;align-items:flex-end;justify-content:space-around;padding:7px 6px calc(7px + var(--safeb))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.nav button .e{font-size:22px;filter:grayscale(.6);opacity:.7}
.nav button.on{color:var(--rosas2)} .nav button.on .e{filter:none;opacity:1}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .2s}
#splash img{width:120px;height:120px;border-radius:32px;box-shadow:var(--shadow);animation:hop 1.2s ease-in-out infinite}
#splash .brand{font-size:30px}
#splash .tag2{color:var(--muted);font-weight:800;font-size:14px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hop{animation:hop 1.6s ease-in-out infinite}
@media print{ body > *{display:none!important} body.printing #printArea{display:block!important} }
#printArea{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

})();

const $ = s => document.querySelector(s);

const SAFARI_VER = (() => { const m = UA.match(/Version\/(\d+)/); return m ? +m[1] : 0; })();

const LS = {
  get(k, d) { try { const v = localStorage.getItem('pc_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pc_' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('pc_' + k); } catch (e) { } }
};
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('puscart', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode); const st = t.objectStore('kv');
      const out = fn(st);
      t.oncomplete = () => res(out instanceof IDBRequest ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('readonly', st => st.get(k)).catch(() => undefined),
    set: (k, v) => tx('readwrite', st => { st.put(v, k); }).catch(() => { })
  };
})();

/* ---------- state ---------- */
const S = {
  settings: null, products: [], sales: [], moves: [], soldBefore: {}, salesCutoff: '', sub: null, support: '', grace: 7,
  ops: [], lastOk: 0, view: 'sell', online: navigator.onLine, syncing: false, log: [], pinSet: undefined,
  cart: [], q: '', itemsQ: '', itemsF: 'all', salesP: 'today', repP: 'today'
};
const K = n => n + '_' + CODE;
let deviceId = LS.get('device');
if (!deviceId) { deviceId = 'd' + Math.random().toString(36).slice(2, 9); LS.set('device', deviceId); }

const L = (tl, en) => LANG === 'tl' ? tl : en;

const CURRENCIES = {
  PHP: { f: '🇵🇭', loc: 'en-PH', sym: '₱', tl: 'Peso', en: 'Peso' },
  USD: { f: '🇺🇸', loc: 'en-US', sym: '$', tl: 'Dollar', en: 'Dollar' },
  EUR: { f: '🇪🇺', loc: 'en-IE', sym: '€', tl: 'Euro', en: 'Euro' }
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const pad = n => String(n).padStart(2, '0');

const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };

const cur = () => (S.settings && S.settings.currency) || 'PHP';
const sym = () => CURRENCIES[cur()].sym;
let _nf = {};
function money(n) {
  const c = cur();
  if (!_nf[c]) { try { _nf[c] = new Intl.NumberFormat(CURRENCIES[c].loc, { style: 'currency', currency: c, minimumFractionDigits: 2, maximumFractionDigits: 2 }); } catch (e) { _nf[c] = { format: v => CURRENCIES[c].sym + Number(v).toFixed(2) }; } }
  return _nf[c].format(Number(n) || 0);
}
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const r2 = n => Math.round(n * 100) / 100;
const MONTHS = { tl: ['Ene', 'Peb', 'Mar', 'Abr', 'May', 'Hun', 'Hul', 'Ago', 'Set', 'Okt', 'Nob', 'Dis'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
function prettyDate(s) {
  if (s === today()) return L('Ngayon', 'Today');
  if (s === addDays(today(), -1)) return L('Kahapon', 'Yesterday');
  const d = parseYmd(s); return MONTHS[LANG][d.getMonth()] + ' ' + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? ', ' + d.getFullYear() : '');
}
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
function timeAgo(iso) {
  const t = new Date(iso).getTime(); if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return L('ngayon lang', 'just now');
  if (m < 60) return m + L(' min ang nakaraan', ' min ago');
  const h = Math.round(m / 60); if (h < 24) return h + L(' oras ang nakaraan', ' hr ago');
  return prettyDate(ymd(new Date(t))) + ' ' + hhmm(iso);

const myName = () => LS.get(K('name'), '') || '';
const isOwnerDevice = () => !!LS.get(K('owner'), false);
const live = arr => arr.filter(x => !x.deleted);
const liveSales = () => S.sales.filter(s => !s.voided);

/* ---------- barcodes ---------- */
// UPC-A (12 digits) and EAN-13 with a leading 0 are the same product
const normCode = c => { c = String(c || '').replace(/\s/g, ''); return /^\d{12}$/.test(c) ? '0' + c : c; };
const findByCode = c => { const n = normCode(c); return n ? live(S.products).find(p => p.barcode && normCode(p.barcode) === n) : null; };

/* ---------- owner PIN ---------- */
const pinKey = () => LS.get(K('pin'), '');
const isOwner = () => !!pinKey();
async function pinHash(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('puscart:' + pin));
  return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
}
// can this phone void this sale? ('' = yes)
function voidLock(s) {
  if (isOwner()) return '';
  if (s.device !== deviceId) return L('🔒 Owner lang ang pwedeng mag-void ng benta ng iba.', "🔒 Only the owner can void someone else's sale.");
  if (!(s.createdAt && ymd(new Date(s.createdAt)) === today())) return L('🔒 Pwede lang i-void sa parehong araw. Sabihan si Owner.', '🔒 Sales can only be voided on the same day. Tell the owner.');
  return '';
}
const ALERT_ACTIONS = ['edit', 'delete', 'void', 'adj'];
const staffChanges = () => (S.log || []).filter(r => r.role === 'staff' && ALERT_ACTIONS.includes(r.action));
const unseenAlerts = () => { const seen = LS.get(K('seen'), ''); return staffChanges().filter(r => String(r.time) > seen); };

/* =================================================================
   STOCK — counted from movements, never typed over
   stock = starting stock + deliveries/adjustments − sold
   ================================================================= */
let _stockCache = null;
function stockMap() {
  if (_stockCache) return _stockCache;
  const m = {};
  S.products.forEach(p => m[p.id] = (Number(p.startStock) || 0) - (Number(S.soldBefore[p.id]) || 0));
  live(S.moves).forEach(v => { if (m[v.pid] !== undefined) m[v.pid] += Number(v.qty) || 0; });
  liveSales().forEach(s => (s.items || []).forEach(it => { if (it.pid && m[it.pid] !== undefined) m[it.pid] -= Number(it.qty) || 0; }));
  Object.keys(m).forEach(k => m[k] = Math.round(m[k] * 1000) / 1000);
  return (_stockCache = m);
}
const stockOf = p => stockMap()[p.id] || 0;
const lowDefault = () => { const v = S.settings && S.settings.lowDefault; return v === undefined || v === '' ? 5 : num(v); };
const lowOf = p => (p.low === '' || p.low == null || isNaN(Number(p.low))) ? lowDefault() : Number(p.low);
const stockState = p => { const s = stockOf(p); return s <= 0 ? 'out' : s <= lowOf(p) ? 'low' : 'ok'; };
function stockBadge(p) {
  const s = stockOf(p), st = stockState(p);
  return '<span class="badge ' + (st === 'ok' ? '' : st) + '">' + (st === 'out' ? L('Ubos', 'Out') : s + ' ' + L('natitira', 'left')) + '</span>';
}
const lowList = () => live(S.products).filter(p => stockState(p) !== 'ok').sort((a, b) => stockOf(a) - stockOf(b));

   API (real Apps Script, or demo mode saved on this phone)
   ================================================================= */
async function api(action, payload, timeoutMs) {
  const body = Object.assign({ action, code: CODE, device: deviceId }, payload || {});
  if (DEMO) return mockApi(body);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 25000);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal, redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Server error');
    return j;
  } finally { clearTimeout(t); }
}

function mockApi(b) {
  const key = 'mock_' + CODE;
  const db = LS.get(key, { settings: null, products: [], sales: [], moves: [], log: [] });
  const save = () => LS.set(key, db);
  const trialEnds = new Date(); trialEnds.setDate(trialEnds.getDate() + 14);
  const own = p => !!(p && db.pinHash && p === db.pinHash);
  const payload = () => ({ ok: true, pinSet: !!db.pinHash, pinOk: own(b.pin || b.pinHash), sub: { state: 'trial', daysLeft: 14, until: ymd(trialEnds) }, support: 'Demo mode', grace: 7, settings: db.settings, products: db.products, sales: db.sales, moves: db.moves, soldBefore: {}, salesCutoff: '' });
  const allowed = op => {
    if (own(b.pin)) return true;
    if (op.op === 'settings') return false;
    if (op.table === 'products') return true;
    const ex = db[op.table].find(x => x.id === op.rec.id); if (!ex) return true;
    if (op.table === 'sales') return op.action === 'void' && ex.device === op.device && ymd(new Date(ex.createdAt)) === today();
    return false;
  };
  return new Promise(res => setTimeout(() => {
    if (b.action === 'init') return res(payload());
    if (b.action === 'setup') {
      if (!(db.settings && db.settings.setupDone)) {
        db.settings = Object.assign({}, b.settings, { setupDone: true }); db.pinHash = b.pinHash || '';
        db.log.unshift({ time: nowIso(), by: b.by, action: 'setup', summary: b.settings.storeName, role: 'owner' });
        demoSeed(db, b.by); save();
      }
      return res(payload());
    }
    if (b.action === 'verifyPin') return res({ ok: true, valid: own(b.pinHash) });
    if (b.action === 'setPin') { if (db.pinHash && !own(b.oldPinHash)) return res({ ok: false, error: 'PIN_EXISTS' }); db.pinHash = b.pinHash; save(); return res(payload()); }
    if (b.action === 'sync') {
      const rejected = [];
      (b.ops || []).forEach(op => {
        if (!allowed(op)) { rejected.push({ id: op.rec && op.rec.id, action: op.action }); return; }
        if (op.op === 'settings') db.settings = Object.assign({}, db.settings, op.data);
        else {
          const arr = db[op.table]; const i = arr.findIndex(x => x.id === op.rec.id);
          if (i >= 0) { if (!(op.rec.updatedAt < arr[i].updatedAt)) arr[i] = op.rec; } else arr.push(op.rec);
        }
        db.log.unshift({ time: op.at, by: op.by, action: op.action || op.op, table: op.table, summary: op.summary, role: own(b.pin) ? 'owner' : 'staff' });
      });
      db.log = db.log.slice(0, 300); save(); return res(Object.assign(payload(), { rejected }));
    }
    if (b.action === 'log') return res({ ok: true, log: db.log });
    res({ ok: false, error: 'unknown' });
  }, 120));
}

async function loadCache() {
  const d = await DB.get(K('data'));
  if (d) Object.assign(S, { settings: d.settings, products: d.products || [], sales: d.sales || [], moves: d.moves || [], soldBefore: d.soldBefore || {}, salesCutoff: d.salesCutoff || '', sub: d.sub, support: d.support || '', grace: d.grace || 7, lastOk: d.lastOk || 0, pinSet: d.pinSet });
  S.ops = (await DB.get(K('ops'))) || [];
  S.log = (await DB.get(K('log'))) || [];
  S.cart = LS.get(K('cart'), []) || [];
  ensureLocalPending();
  return !!d;
}
function saveCache() {
  return DB.set(K('data'), { settings: S.settings, products: S.products, sales: S.sales, moves: S.moves, soldBefore: S.soldBefore, salesCutoff: S.salesCutoff, sub: S.sub, support: S.support, grace: S.grace, lastOk: S.lastOk, pinSet: S.pinSet });
}
function applyServer(j) {
  if (j.settings !== undefined) S.settings = j.settings;
  S.products = j.products || [];
  S.sales = j.sales || [];
  S.moves = j.moves || [];
  S.soldBefore = j.soldBefore || {};
  S.salesCutoff = j.salesCutoff || '';
  S.sub = j.sub; S.support = j.support || S.support; S.grace = j.grace || 7;
  S.lastOk = Date.now();
  if (j.pinSet !== undefined) S.pinSet = j.pinSet;
  if (pinKey() && j.pinOk === false && j.sub && j.sub.state !== 'invalid') { LS.del(K('pin')); setTimeout(() => toast(L('Napalitan ang Owner PIN. Ilagay ulit sa Settings.', 'The Owner PIN changed. Enter it again in Settings.'), 'think'), 800); }
  ensureLocalPending();
}
function ensureLocalPending() { S.ops.forEach(applyLocal); _stockCache = null; }
function applyLocal(op) {
  _stockCache = null;
  if (op.op === 'settings') { S.settings = Object.assign({}, S.settings, op.data); return; }
  const arr = S[op.table]; if (!arr) return;
  const i = arr.findIndex(x => x.id === op.rec.id);
  if (i >= 0) { if (!(op.rec.updatedAt < arr[i].updatedAt)) arr[i] = Object.assign({}, arr[i], op.rec); }
  else arr.push(Object.assign({}, op.rec));
}
async function queueOp(op, noFlush) {
  op.uid = uid('o'); op.at = nowIso(); op.by = myName() || 'Owner'; op.device = deviceId;
  S.ops.push(op); applyLocal(op);
  await DB.set(K('ops'), S.ops); saveCache();
  updateSyncBadge(); if (!noFlush) flush();
}
async function flush(force) {
  if (S.syncing) { if (force) setTimeout(() => flush(true), 1500); return; }
  if (!navigator.onLine && !DEMO) { updateSyncBadge(); return; }
  S.syncing = true; updateSyncBadge();
  try {
    const sending = S.ops.slice();
    const j = await api('sync', { pin: pinKey(), ops: sending });
    const sent = new Set(sending.map(o => o.uid));
    S.ops = S.ops.filter(o => !sent.has(o.uid));
    await DB.set(K('ops'), S.ops);
    applyServer(j); await saveCache();
    if (j.rejected && j.rejected.length) toast(L('May ' + j.rejected.length + ' pagbabago na hindi pinayagan — Owner lang ang pwede.', j.rejected.length + ' change(s) not allowed — owner only.'), 'sad');
    if (isOwner() && sending.length) loadLog();
    gateCheck();
    if (!document.querySelector('.sheet.show') && !tourActive && !document.querySelector('.screen') && !document.querySelector('.scanner') && !typingNow()) render();
    if (S.ops.length) setTimeout(flush, 400);
  } catch (e) {
    console.warn('sync failed', e);
  } finally {
    S.syncing = false; updateSyncBadge();
  }
}

function salesRange(p) {
  const t = today();
  if (p === 'today') return [t, t];
  if (p === 'yday') { const y = addDays(t, -1); return [y, y]; }
  if (p === 'week') return [addDays(t, -6), t];
  if (p === 'month') return [t.slice(0, 8) + '01', t];
  if (p === 'lmonth') { const d = parseYmd(t.slice(0, 8) + '01'); d.setMonth(d.getMonth() - 1); const s = ymd(d); const e = addDays(t.slice(0, 8) + '01', -1); return [s, e]; }
  if (p === 'd30') return [addDays(t, -29), t];
  return ['0000', '9999'];
}
const PERIODS = () => [['today', L('Ngayon', 'Today')], ['yday', L('Kahapon', 'Yesterday')], ['week', L('7 araw', '7 days')], ['month', L('Ngayong buwan', 'This month')], ['lmonth', L('Nakaraang buwan', 'Last month')]];

function reportData(from, to) {
  const sales = liveSales().filter(s => s.date >= from && s.date <= to);
  const R = { n: sales.length, total: 0, profit: 0, costKnown: 0, noCost: 0, byMethod: {}, byStaff: {}, byItem: {}, byDay: {}, voids: S.sales.filter(s => s.voided && s.date >= from && s.date <= to).length };
  sales.forEach(s => {
    const t = +s.total || 0; R.total += t;
    R.byMethod[s.method || 'cash'] = (R.byMethod[s.method || 'cash'] || 0) + t;
    R.byStaff[s.by || '?'] = (R.byStaff[s.by || '?'] || 0) + t;
    R.byDay[s.date] = (R.byDay[s.date] || 0) + t;
    (s.items || []).forEach(it => {
      const k = it.pid || ('x:' + it.name), line = (+it.price || 0) * (+it.qty || 0);
      const o = R.byItem[k] || (R.byItem[k] = { name: it.name, qty: 0, amt: 0 });
      o.qty += +it.qty || 0; o.amt += line;
      if (+it.cost > 0) { R.profit += line - it.cost * it.qty; R.costKnown += line; } else R.noCost += line;
    });
  });
  return R;
}
function invValue() {
  let cost = 0, retail = 0, noCost = 0;
  live(S.products).forEach(p => { const s = Math.max(0, stockOf(p)); retail += s * (+p.price || 0); if (+p.cost > 0) cost += s * p.cost; else if (s > 0) noCost++; });
  return { cost, retail, noCost };
}

function csvSales() {
  const [from, to] = salesRange(S.repP);
  const rows = [['Date', 'Time', 'Sale ID', 'Item', 'Barcode', 'Qty', 'Price', 'Line total', 'Cost', 'Payment', 'By', 'Voided']];
  S.sales.filter(s => s.date >= from && s.date <= to).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt))).forEach(s => (s.items || []).forEach(it =>
    rows.push([s.date, hhmm(s.createdAt), s.id, it.name, it.barcode || '', it.qty, it.price, r2(it.price * it.qty), it.cost || '', s.method, s.by, s.voided ? 'VOID' : ''])));
  downloadCsv('Puscart-benta-' + from + '_' + to + '.csv', rows);
}
function csvStock() {
  const rows = [['Item', 'Barcode', 'Price', 'Cost', 'Stock', 'Low alert at', 'Stock value (cost)', 'Stock value (price)']];
  live(S.products).sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(p => { const s = stockOf(p); rows.push([p.name, p.barcode, p.price, p.cost || '', s, lowOf(p), p.cost ? r2(Math.max(0, s) * p.cost) : '', r2(Math.max(0, s) * p.price)]); });
  downloadCsv('Puscart-stock-' + today() + '.csv', rows);
}

/* =================================================================
   SHEETS (pop-up panels)
   ================================================================= */
let sheetEl, backEl, sheetOnClose;
function openSheet(html, onClose) {
  closeSheet(true);
  backEl = document.createElement('div'); backEl.className = 'backdrop';
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet';
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(backEl, sheetEl);
  backEl.addEventListener('click', () => closeSheet());
  sheetOnClose = onClose;
  requestAnimationFrame(() => { backEl.classList.add('show'); sheetEl.classList.add('show'); });
  return sheetEl;
}
function closeSheet(instant) {
  if (!sheetEl) return;
  const s = sheetEl, b = backEl, cb = sheetOnClose; sheetEl = backEl = sheetOnClose = null;
  if (instant) { s.remove(); b.remove(); } else { s.classList.remove('show'); b.classList.remove('show'); setTimeout(() => { s.remove(); b.remove(); }, 180); }
  cb && cb();
}
function promptSheet(title, value, kind) {
  return new Promise(res => {
    let done = false;
    const el = openSheet('<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="x" data-x>×</button></div>' +
      (kind === 'money' ? '<div class="amtwrap"><span>' + sym() + '</span><input id="pv" inputmode="decimal" value="' + esc(value) + '"></div>'
        : '<input class="inp" id="pv" ' + (kind === 'num' ? 'inputmode="decimal" style="font-size:26px;text-align:center;margin-bottom:12px"' : 'style="margin-bottom:12px"') + ' value="' + esc(value) + '">') +
      '<button class="btn main" data-ok>' + L('I-save', 'Save') + '</button>', () => { if (!done) res(null); });
    const i = el.querySelector('#pv'); setTimeout(() => { i.focus(); i.select && i.select(); }, 200);
    const ok = () => { done = true; const v = i.value; closeSheet(); res(v); };
    el.querySelector('[data-x]').onclick = () => closeSheet();
    el.querySelector('[data-ok]').onclick = ok;
    i.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  });
}
function pickSheet(title, opts, sel) {
  return new Promise(res => {
    let done = false;
    const el = openSheet('<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="x" data-x>×</button></div><div class="opts">' +
      opts.map(o => '<button class="opt ' + (o.v === sel ? 'sel' : '') + '" data-v="' + o.v + '">' + o.label + '</button>').join('') + '</div>', () => { if (!done) res(null); });
    el.querySelector('[data-x]').onclick = () => closeSheet();
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { done = true; closeSheet(); res(b.dataset.v); });
  });
}
function confirmSheet(title, msg, okText, danger) {
  return new Promise(res => {
    let done = false;
    const el = openSheet('<div class="sheet-head"><h2>' + title + '</h2><button class="x" data-x>×</button></div><div class="infobar" style="font-size:15px">' + msg + '</div>' +
      '<div class="row2"><button class="btn soft" data-no>' + L('Huwag', 'Cancel') + '</button><button class="btn ' + (danger ? 'pink' : 'main') + '" data-ok>' + okText + '</button></div>', () => { if (!done) res(false); });
    el.querySelector('[data-x]').onclick = el.querySelector('[data-no]').onclick = () => closeSheet();
    el.querySelector('[data-ok]').onclick = () => { done = true; closeSheet(); res(true); };
  });
}

// returns a Promise with the saved product (or null)
function openItem(existing, preset) {
  return new Promise(resolve => {
    const isNew = !existing;
    const p = existing ? Object.assign({}, existing) : Object.assign({ id: uid('p'), barcode: '', name: '', price: '', cost: '', startStock: '', low: '', quick: false, unit: 'pc' }, preset || {});
    let saved = null;
    const stockNow = isNew ? 0 : stockOf(existing);
    const el = openSheet(
      '<div class="sheet-head"><h2>' + (isNew ? '＋ ' + L('Bagong paninda', 'New item') : '✏️ ' + esc(p.name)) + '</h2><button class="x" data-x>×</button></div>' +
      (isNew && p.barcode ? '<div class="infobar">🐱 ' + L('Bagong barcode! I-type lang ang pangalan at presyo.', 'New barcode! Just type the name and price.') + '</div>' : '') +
      '<div class="field"><label>' + L('Barcode', 'Barcode') + ' <small>' + L('(opsyonal — i-scan o i-type)', '(optional — scan or type)') + '</small></label><div class="inrow"><input class="inp" id="f-code" inputmode="numeric" value="' + esc(p.barcode) + '" placeholder="480…"><button class="sbtn" id="f-scan" aria-label="Scan">📷</button></div></div>' +
      '<div class="field"><label>' + L('Pangalan', 'Name') + '</label><input class="inp" id="f-name" value="' + esc(p.name) + '" placeholder="' + L('hal. Coke Mismo 300ml', 'e.g. Coke Mismo 300ml') + '"></div>' +
      '<div class="row2"><div class="field"><label>' + L('Presyo (benta)', 'Selling price') + '</label><div class="amtwrap" style="margin:0;padding:6px 12px"><span style="font-size:20px">' + sym() + '</span><input id="f-price" inputmode="decimal" style="font-size:24px" value="' + esc(p.price) + '" placeholder="0.00"></div></div>' +
      '<div class="field"><label>' + L('Puhunan', 'Cost') + ' <small>' + L('(opsyonal)', '(optional)') + '</small></label><div class="amtwrap" style="margin:0;padding:6px 12px"><span style="font-size:20px">' + sym() + '</span><input id="f-cost" inputmode="decimal" style="font-size:24px" value="' + esc(p.cost || '') + '" placeholder="—"></div></div></div>' +
      '<div id="f-margin" class="small b muted" style="margin:-4px 4px 10px"></div>' +
      (isNew ? '<div class="field"><label>' + L('Ilan ang stock ngayon?', 'How many in stock now?') + '</label><input class="inp" id="f-stock" inputmode="decimal" value="' + esc(p.startStock) + '" placeholder="0"></div>'
        : '<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="small b muted">' + L('Stock ngayon', 'In stock now') + '</div><div style="font-size:24px;font-weight:900">' + stockNow + '</div></div>' + stockBadge(existing) + '</div>' +
        '<div class="row2" style="margin-bottom:12px"><button class="btn soft" style="font-size:14px;padding:12px 6px" id="f-in">📥 ' + L('Dagdag stock', 'Add stock') + '</button><button class="btn soft" style="font-size:14px;padding:12px 6px" id="f-adj">✏️ ' + L('Ayusin ang bilang', 'Fix the count') + '</button></div>') +
      '<div class="field"><label>' + L('Abisuhan ako kapag', 'Warn me when') + ' <small>' + L('(natitira ay ito o mas mababa)', '(this many or fewer left)') + '</small></label><input class="inp" id="f-low" inputmode="numeric" value="' + esc(p.low) + '" placeholder="' + lowDefault() + '"></div>' +
      '<div class="set" style="margin-bottom:8px"><div>⭐ ' + L('Mabilis na pindot sa Benta', 'Quick button on Sell') + '<div class="muted">' + L('Para sa walang barcode (yelo, itlog, tingi)', 'For things without a barcode (ice, eggs, loose items)') + '</div></div><button class="switch ' + (p.quick ? 'on' : '') + '" id="f-quick" aria-label="quick"></button></div>' +
      '<button class="btn pink" id="f-save">' + L('I-save', 'Save') + '</button>' +
      (isNew ? '' : '<button class="btn danger" id="f-del" style="margin-top:10px">🗑️ ' + L('Burahin ang paninda', 'Delete item') + '</button><h3>📜 ' + L('Galaw ng stock', 'Stock history') + '</h3><div class="card" style="padding:4px 12px">' + itemHistory(existing) + '</div>'),
      () => resolve(saved));
    const $f = s => el.querySelector(s);
    $f('[data-x]').onclick = () => closeSheet();
    const margin = () => { const pr = num($f('#f-price').value), c = num($f('#f-cost').value); $f('#f-margin').textContent = pr && c ? L('Tubo bawat isa: ', 'Profit each: ') + money(pr - c) + ' (' + Math.round((pr - c) / pr * 100) + '%)' : ''; };
    $f('#f-price').oninput = $f('#f-cost').oninput = margin; margin();
    $f('#f-quick').onclick = () => $f('#f-quick').classList.toggle('on');
    $f('#f-scan').onclick = () => openScanner(code => { $f('#f-code').value = normCode(code); beep(); }, { continuous: false });
    if (!isNew) {
      $f('#f-in').onclick = () => { closeSheet(true); openDelivery([{ pid: existing.id, qty: 1, cost: '' }]); };
      $f('#f-adj').onclick = () => { closeSheet(true); adjustStock(existing); };
      $f('#f-del').onclick = async () => {
        if (!await confirmSheet('🗑️ ' + esc(existing.name), L('Buburahin ang paninda sa listahan. Hindi mabubura ang mga lumang benta.', "The item will be removed from the list. Past sales stay."), L('Burahin', 'Delete'), true)) return;
        queueOp({ op: 'upsert', table: 'products', action: 'delete', rec: Object.assign({}, existing, { deleted: true, updatedAt: nowIso() }), summary: '🗑️ ' + existing.name });
        closeSheet(true); toast(L('Nabura na', 'Deleted'), 'happy'); render();
      };
    }
    setTimeout(() => (isNew && p.barcode ? $f('#f-name') : isNew ? $f('#f-code') : null)?.focus(), 250);
    $f('#f-save').onclick = () => {
      const code = normCode($f('#f-code').value.trim()), name = $f('#f-name').value.trim(), price = num($f('#f-price').value);
      const bad = (s, m) => { const i = $f(s); (i.closest('.amtwrap') || i).style.borderColor = 'var(--red)'; toast(m, 'sad'); };
      if (!name) return bad('#f-name', L('Ilagay ang pangalan', 'Enter a name'));
      if (!(price > 0) && String($f('#f-price').value).trim() !== '0') return bad('#f-price', L('Ilagay ang presyo', 'Enter the price'));
      const dup = code && live(S.products).find(x => x.id !== p.id && x.barcode && normCode(x.barcode) === code);
      if (dup) return bad('#f-code', L('Gamit na ang barcode na ito ng: ', 'This barcode is already used by: ') + dup.name);
      const at = nowIso();
      const lowV = $f('#f-low').value.trim();
      const costV = $f('#f-cost').value.trim();
      const rec = Object.assign({}, p, { barcode: code, name, price, cost: costV === '' ? 0 : num(costV), low: lowV === '' ? '' : num(lowV), quick: $f('#f-quick').classList.contains('on'), updatedAt: at });
      if (isNew) Object.assign(rec, { startStock: num($f('#f-stock').value), by: myName(), device: deviceId, createdAt: at, deleted: false });
      let summary = (isNew ? '＋ ' : '✏️ ') + name + ' · ' + money(price);
      if (!isNew && +existing.price !== price) summary = '✏️ ' + name + ': ' + L('presyo ', 'price ') + money(existing.price) + ' → ' + money(price);
      queueOp({ op: 'upsert', table: 'products', action: isNew ? 'add' : 'edit', rec, summary });
      saved = rec; closeSheet();
      if (!isOwner() && !isNew) toast(L('Na-save! Aabisuhan si Owner sa pagbabago.', 'Saved! The owner will be notified.'), 'happy');
      else toast(isNew ? L('Bagong paninda! Meow! 🐱', 'New item added! Meow! 🐱') : L('Na-save!', 'Saved!'), 'cheer');
      if (S.view === 'items') render();
    };
  });
}
const quickAddProduct = preset => openItem(null, preset);
function itemHistory(p) {
  const rows = [];
  live(S.moves).filter(m => m.pid === p.id).forEach(m => rows.push({ t: m.createdAt, d: m.date, q: +m.qty, txt: (m.kind === 'in' ? '📥 ' + L('Dumating', 'Arrived') : '✏️ ' + L('Inayos', 'Adjusted')) + (m.note ? ' · ' + m.note : ''), by: m.by, mid: m.id }));
  const sold = {};
  liveSales().forEach(s => (s.items || []).forEach(it => { if (it.pid === p.id) sold[s.date] = (sold[s.date] || 0) + (+it.qty || 0); }));
  Object.keys(sold).forEach(d => rows.push({ t: d + 'T23:59', d, q: -sold[d], txt: '🛒 ' + L('Nabenta', 'Sold') }));
  rows.push({ t: p.createdAt || '', d: (p.createdAt || '').slice(0, 10), q: +p.startStock || 0, txt: '🏁 ' + L('Simulang bilang', 'Starting count'), by: p.by });
  rows.sort((a, b) => String(b.t).localeCompare(String(a.t)));
  return rows.slice(0, 40).map(r => '<div class="item"><div class="mid"><div class="t1" style="font-size:14px">' + esc(r.txt) + '</div><div class="t2">' + (r.d ? prettyDate(r.d) : '') + (r.by ? ' · ' + esc(r.by) : '') + '</div></div><div class="val" style="color:' + (r.q < 0 ? 'var(--red)' : 'var(--tealD)') + '">' + (r.q > 0 ? '+' : '') + r.q + '</div>' +
    (r.mid && isOwner() ? '<button class="x" style="width:32px;height:32px;font-size:14px" onclick="delMove(\'' + r.mid + '\')">🗑️</button>' : '') + '</div>').join('');
}
async function delMove(id) {
  const m = S.moves.find(x => x.id === id); if (!m) return;
  if (!await confirmSheet(L('Burahin ang galaw na ito?', 'Delete this stock record?'), esc((m.kind === 'in' ? '📥 ' : '✏️ ') + (m.qty > 0 ? '+' : '') + m.qty + (m.note ? ' · ' + m.note : '')), L('Burahin', 'Delete'), true)) return;
  const p = S.products.find(x => x.id === m.pid);
  queueOp({ op: 'upsert', table: 'moves', action: 'delete', rec: Object.assign({}, m, { deleted: true, updatedAt: nowIso() }), summary: '🗑️ ' + (p ? p.name : '') + ' ' + (m.qty > 0 ? '+' : '') + m.qty });
  toast(L('Nabura', 'Deleted'), 'happy'); if (p) openItem(S.products.find(x => x.id === p.id)); render();
}

/* ---------- fix the count (damaged, expired, recount) ---------- */
function adjustStock(p) {
  const now = stockOf(p);
  const REASONS = [['count', '🔢', L('Binilang ulit', 'Recounted')], ['damaged', '💥', L('Nasira', 'Damaged')], ['expired', '📅', L('Expired', 'Expired')], ['lost', '❓', L('Nawala', 'Missing')], ['own', '🏠', L('Kinuha ng may-ari', 'Taken by owner')]];
  let mode = 'count';
  const el = openSheet('<div class="sheet-head"><h2>✏️ ' + esc(p.name) + '</h2><button class="x" data-x>×</button></div>' +
    '<div class="infobar">' + L('Stock ayon sa Puscart: ', 'Stock according to Puscart: ') + '<b>' + now + '</b></div>' +
    '<div class="cats" style="margin-bottom:12px">' + REASONS.map(r => '<button class="cat ' + (r[0] === mode ? 'sel' : '') + '" data-r="' + r[0] + '">' + r[1] + ' ' + r[2] + '</button>').join('') + '</div>' +
    '<div class="field"><label id="a-lbl"></label><input class="inp" id="a-v" inputmode="decimal" style="font-size:24px;text-align:center"></div><div id="a-res" class="small b muted" style="margin:-4px 4px 12px"></div>' +
    (isOwner() ? '' : '<div class="infobar">🔔 ' + L('Aabisuhan si Owner sa pagbabagong ito.', 'The owner will be notified of this change.') + '</div>') +
    '<button class="btn pink" id="a-ok">' + L('I-save', 'Save') + '</button>');
  const $a = s => el.querySelector(s);
  const paint = () => {
    el.querySelectorAll('[data-r]').forEach(b => b.classList.toggle('sel', b.dataset.r === mode));
    $a('#a-lbl').textContent = mode === 'count' ? L('Ilan talaga ang nasa tindahan?', 'How many are really in the store?') : L('Ilan ang aalisin?', 'How many to remove?');
    calc();
  };
  const diff = () => { const v = $a('#a-v').value.trim(); if (v === '') return null; const n = num(v); return mode === 'count' ? r2(n - now) : -Math.abs(n); };
  const calc = () => { const d = diff(); $a('#a-res').textContent = d === null ? '' : L('Pagbabago: ', 'Change: ') + (d > 0 ? '+' : '') + d + ' → ' + L('bagong stock: ', 'new stock: ') + r2(now + d); };
  $a('#a-v').oninput = calc;
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { mode = b.dataset.r; paint(); });
  $a('[data-x]').onclick = () => closeSheet();
  $a('#a-ok').onclick = () => {
    const d = diff(); if (d === null || d === 0) { closeSheet(); return; }
    const r = REASONS.find(x => x[0] === mode), at = nowIso();
    const rec = { id: uid('m'), date: today(), pid: p.id, qty: d, kind: 'adj', cost: 0, note: r[2], batch: '', by: myName(), device: deviceId, createdAt: at, updatedAt: at, deleted: false };
    queueOp({ op: 'upsert', table: 'moves', action: 'adj', rec, summary: '✏️ ' + p.name + ': ' + (d > 0 ? '+' : '') + d + ' (' + r[2] + ')' });
    closeSheet(); toast(L('Naayos ang bilang!', 'Count fixed!'), 'cheer'); render();
  };
  paint(); setTimeout(() => $a('#a-v').focus(), 250);
}

/* ---------- stock arrived (delivery) ---------- */
function openDelivery(startLines) {
  const lines = (startLines || []).slice();
  let note = '', updCost = true;
  const el = openSheet('<div class="sheet-head"><h2>📥 ' + L('Dumating na stock', 'Stock arrived') + '</h2><button class="x" data-x>×</button></div>' +
    '<div class="infobar">' + L('I-scan o hanapin ang bawat paninda na dumating, tapos ilagay kung ilan.', 'Scan or search each item that arrived, then enter how many.') + '</div>' +
    '<div class="inrow" style="margin-bottom:6px"><input class="inp" id="d-q" placeholder="🔎 ' + L('Pangalan o barcode', 'Name or barcode') + '" autocomplete="off"><button class="sbtn" id="d-scan">📷</button></div><div id="d-sugg"></div>' +
    '<div id="d-lines"></div>' +
    '<div class="field"><label>' + L('Supplier / tala', 'Supplier / note') + ' <small>' + L('(opsyonal)', '(optional)') + '</small></label><input class="inp" id="d-note" placeholder="' + L('hal. Puregold, Ahente ng Coke', 'e.g. Puregold, Coke agent') + '"></div>' +
    '<div class="set" style="margin-bottom:8px"><div>' + L('I-update ang puhunan ng paninda', "Update the item's cost") + '<div class="muted">' + L('Gamit ang binayad mo ÷ dami', 'Using what you paid ÷ quantity') + '</div></div><button class="switch on" id="d-upd"></button></div>' +
    '<div id="d-tot" class="change" style="background:var(--teal2);color:var(--tealD)"></div>' +
    '<button class="btn teal" id="d-ok">✅ ' + L('I-save ang dumating', 'Save delivery') + '</button>');
  const $d = s => el.querySelector(s);
  const addLine = p => { const ex = lines.find(l => l.pid === p.id); if (ex) ex.qty = r2(ex.qty + 1); else lines.unshift({ pid: p.id, qty: 1, cost: '' }); paint(); };
  function paint() {
    $d('#d-lines').innerHTML = !lines.length ? '<div class="card empty" style="padding:12px">' + L('Wala pang nailagay.', 'Nothing added yet.') + '</div>'
      : '<div class="card" style="padding:4px 12px">' + lines.map((l, i) => { const p = S.products.find(x => x.id === l.pid) || { name: '?' }; return '<div class="ci" style="display:block;padding:10px 0;border-bottom:1px dashed var(--line)"><div style="display:flex;justify-content:space-between;gap:8px;font-weight:900"><span>' + esc(p.name) + '</span><button data-rm="' + i + '" style="color:var(--muted)">✕</button></div>' +
        '<div class="row2" style="margin-top:6px"><div><div class="small b muted">' + L('Ilan', 'Qty') + '</div><input class="inp" data-q="' + i + '" inputmode="decimal" value="' + l.qty + '" style="font-size:20px;text-align:center"></div><div><div class="small b muted">' + L('Binayad (kabuuan)', 'Paid (total)') + '</div><input class="inp" data-c="' + i + '" inputmode="decimal" value="' + l.cost + '" placeholder="' + sym() + ' —" style="font-size:20px;text-align:center"></div></div></div>'; }).join('') + '</div>';
    el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { lines.splice(+b.dataset.rm, 1); paint(); });
    el.querySelectorAll('[data-q]').forEach(i => i.oninput = () => { lines[+i.dataset.q].qty = num(i.value); tot(); });
    el.querySelectorAll('[data-c]').forEach(i => i.oninput = () => { lines[+i.dataset.c].cost = i.value; tot(); });
    tot();
  }
  function tot() {
    const q = lines.reduce((a, l) => a + (+l.qty || 0), 0), c = lines.reduce((a, l) => a + num(l.cost), 0);
    $d('#d-tot').innerHTML = '<span>' + lines.length + L(' paninda · ', ' items · ') + q + L(' piraso', ' pcs') + '</span><b style="font-size:20px">' + (c ? money(c) : '') + '</b>';
  }
  const q = $d('#d-q'), sug = $d('#d-sugg');
  const handle = code => {
    const p = findByCode(code);
    if (p) { addLine(p); beep(); return; }
    beep(false);
    scanPause = true;
    const keep = { lines: lines.slice(), note: $d('#d-note').value };
    openItem(null, { barcode: normCode(code) }).then(np => { scanPause = false; const ls = keep.lines; if (np) ls.unshift({ pid: np.id, qty: 1, cost: '' }); openDelivery(ls); setTimeout(() => { const n = $('#d-note'); if (n) n.value = keep.note; }, 50); });
  };
  q.oninput = () => {
    const v = q.value.trim().toLowerCase();
    if (!v || /^\d{6,}$/.test(v)) { sug.innerHTML = ''; return; }
    const hits = live(S.products).filter(p => (p.name || '').toLowerCase().includes(v)).slice(0, 5);
    sug.innerHTML = '<div class="sugg">' + hits.map(p => '<button data-sp="' + p.id + '"><span>' + esc(p.name) + '</span>' + stockBadge(p) + '</button>').join('') + '<button data-new="1">＋ ' + L('Bagong paninda', 'New item') + '</button></div>';
    sug.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { addLine(S.products.find(p => p.id === b.dataset.sp)); q.value = ''; sug.innerHTML = ''; });

  track = stream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) { const tb = el.querySelector('[data-torch]'); tb.classList.remove('hidden'); let on = false; tb.onclick = () => { on = !on; track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => { }); }; }
    if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => { });
  } catch (e) { }

  let detector = null;
  if ('BarcodeDetector' in window) {
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'].filter(x => f.includes(x));
      if (want.includes('ean_13')) detector = new BarcodeDetector({ formats: want });
    } catch (e) { }
  }
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const found = code => {
    const now = Date.now();
    // same item still under the camera: wait until it leaves before counting it again
    if (code === lastCode && now - lastAt < 1500) { lastAt = now; return; }
    lastCode = code; lastAt = now; idleSince = now;
    box.classList.add('hit'); setTimeout(() => box.classList.remove('hit'), 300);
    const r = onCode(code);
    const p = r && r.name ? r : findByCode(code);
    const last = el.querySelector('[data-last]');
    if (p) { last.classList.remove('hidden'); last.innerHTML = '<span>✅ ' + esc(p.name) + '</span><span>' + money(p.price) + '</span>'; }
    if (!opts.continuous || scanPause) stop();
  };
  async function tick() {
    if (stopped) return;
    try {
      if (video.readyState >= 2 && video.videoWidth) {
        let code = null;
        if (detector) {
          const res = await detector.detect(video);
          if (res && res.length) code = res[0].rawValue;
        } else {
          // crop the middle band (where the box is) and read it
          const vw = video.videoWidth, vh = video.videoHeight;
          const W = Math.min(960, vw), sc = W / vw, bandH = Math.round(vh * 0.5), y0 = Math.round(vh * 0.25);
          cv.width = W; cv.height = Math.round(bandH * sc);
          ctx.drawImage(video, 0, y0, vw, bandH, 0, 0, cv.width, cv.height);
          const c = EAN.fromImageData(ctx.getImageData(0, 0, cv.width, cv.height));
          // must read the same code in 2 frames before we trust it
          if (c) { if (seen.code === c) seen.n++; else seen = { code: c, n: 1 }; if (seen.n >= 2) { code = c; seen = { code: '', n: 0 }; } }
        }
        if (code) found(normCode(code));
        else if (Date.now() - idleSince > 4500) { tip.textContent = L('Ilapit pa nang kaunti, at hawakan nang steady. Kailangan ng ilaw! 💡', 'Move a bit closer and hold steady. Good light helps! 💡'); idleSince = Date.now() + 99999; }
      }
    } catch (e) { }
    timer = setTimeout(tick, detector ? 90 : 60);
  }
  tick();
}

/* ---------- Bluetooth / USB barcode scanners ----------
   These "type" the barcode very fast and press Enter. We catch that anywhere in the app. */
(() => {
  let buf = '', last = 0, fast = 0;
  document.addEventListener('keydown', e => {
    const a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
    if (typing || scannerOpen || !S.settings || document.querySelector('.screen')) { buf = ''; return; }
    const now = Date.now();
    if (e.key === 'Enter') {
      if (buf.length >= 6 && fast >= buf.length - 2) {
        e.preventDefault();
        const code = buf; buf = '';
        if (sheetEl && sheetEl.querySelector('#d-q')) { const q = sheetEl.querySelector('#d-q'); q.value = code; q.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' })); return; }
        if (sheetEl && sheetEl.querySelector('#f-code')) { sheetEl.querySelector('#f-code').value = normCode(code); beep(); return; }
        if (sheetEl) return;
        if (S.view === 'items') { const p = findByCode(code); beep(!!p); if (p) openItem(p); else openItem(null, { barcode: normCode(code) }); return; }
        handleScan(code);
      }
      buf = ''; fast = 0; return;
    }
    if (e.key.length !== 1) return;
    if (now - last > 80) { buf = ''; fast = 0; } else fast++;
    buf += e.key; last = now;
  });
})();

  [['Paano palitan ang presyo?', 'How do I change a price?'], ['Sa <b>Paninda</b>, pindutin ang paninda, palitan ang presyo, at I-save. Kapag staff ang nagpalit, aabisuhan si Owner (🔔). Para sa isang benta lang, pindutin ang pangalan ng paninda sa cart.', 'In <b>Items</b>, tap the item, change the price and Save. If staff change it, the owner is notified (🔔). For one sale only, tap the item name in the cart.'], 'presyo price change palit discount'],

  [['Paano malalaman ang natitirang stock?', 'How do I see stock left?'], ['Sa <b>Paninda</b>, may badge ang bawat isa: berde = ok, dilaw = paubos, pula = ubos. Kusang nababawasan tuwing may benta.', 'In <b>Items</b>, each one has a badge: green = ok, yellow = low, red = out. It goes down automatically with each sale.'], 'stock natitira left inventory imbentaryo bilang'],
  [['Dumating ang delivery, paano ilista?', 'A delivery arrived — how do I record it?'], ['Sa <b>Paninda</b>, pindutin ang <b>📥 Dumating na stock</b>. I-scan o hanapin ang bawat paninda, ilagay kung ilan at magkano ang binayad (opsyonal), tapos I-save.', 'In <b>Items</b>, tap <b>📥 Stock arrived</b>. Scan or search each item, enter how many and what you paid (optional), then Save.'], 'delivery dumating restock supplier dagdag stock arrived'],

  [['Paano mag-set ng abiso sa paubos?', 'How do low-stock alerts work?'], ['May default na bilang sa Settings (hal. 5). Pwede ring iba-iba bawat paninda: buksan ang paninda at palitan ang <b>Abisuhan ako kapag</b>.', 'There\'s a default in Settings (e.g. 5). You can set it per item too: open the item and change <b>Warn me when</b>.'], 'abiso alert low paubos warning'],
  [['Nagkamali sa benta, paano i-void?', 'I made a mistake — how do I void?'], ['Sa <b>Listahan</b>, pindutin ang benta, tapos <b>❌ I-void</b>. Babalik sa stock ang mga paninda. Ang staff ay pwedeng mag-void ng sarili nilang benta sa parehong araw lang, at aabisuhan si Owner.', 'In <b>Sales</b>, tap the sale, then <b>❌ Void</b>. Items go back to stock. Staff can void their own sales on the same day only, and the owner is notified.'], 'void mali mistake cancel bawi refund'],

  [['Pwede bang gamitin ng staff sa ibang phone?', 'Can staff use it on another phone?'], ['Oo. Ipadala ang parehong link. Iisa ang tindahan, kahit ilang phone. Ang staff ay pwedeng magbenta at magdagdag ng paninda, pero ang Ulat at Settings ay para sa Owner lang.', "Yes. Send the same link. It's one store, on any number of phones. Staff can sell and add items, but Reports and Settings are owner-only."], 'staff tauhan phone device link share'],

let helpQ = '', helpOpen = -1;
function helpSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return HELP.map((_, i) => i);
  return HELP.map((h, i) => { const hay = (h[0].join(' ') + ' ' + h[2]).toLowerCase(); return [i, words.reduce((a, w) => a + (hay.includes(w) ? 1 : 0), 0)]; }).filter(x => x[1]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function viewHelp() {
  return '<h2>❓ ' + L('Tanong kay Muffin', 'Ask Muffin') + '</h2><div class="hello"><div class="m">' + mascot('hello') + '</div><div class="bubble">' + L('I-type ang salita at hanapin ang sagot! 🐱', 'Type a word to find the answer! 🐱') + '</div></div>' +
    '<input class="search" id="helpQ" placeholder="🔎 ' + L('hal. scan, presyo, void', 'e.g. scan, price, void') + '" value="' + esc(helpQ) + '"><div id="helpList"></div>';
}
function bindHelp() {
  const q = $('#helpQ'), list = $('#helpList');
  const paint = () => {
    const ids = helpSearch(helpQ), li = LANG === 'tl' ? 0 : 1;
    list.innerHTML = ids.length ? '<div class="card" style="padding:4px 12px">' + ids.map(i => '<div style="border-bottom:1px dashed var(--line)"><button class="item" data-h="' + i + '" style="border:0"><div class="mid"><div class="t1" style="white-space:normal">' + esc(HELP[i][0][li]) + '</div></div><span>' + (helpOpen === i ? '▴' : '▾') + '</span></button>' + (helpOpen === i ? '<div class="infobar" style="margin:0 0 10px;font-size:14px">' + HELP[i][1][li] + '</div>' : '') + '</div>').join('') + '</div>'
      : '<div class="card empty"><div class="m">' + mascot('think') + '</div>' + L('Walang nahanap. Subukan ang ibang salita.', 'Nothing found. Try another word.') + '</div>';
    list.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { helpOpen = helpOpen === +b.dataset.h ? -1 : +b.dataset.h; paint(); });
  };
  q.oninput = () => { helpQ = q.value; helpOpen = -1; paint(); };
  paint();
}

};

/* ---------- owner PIN ---------- */
function askPin(title, sub) {
  return new Promise(res => {
    let done = false;
    const el = openSheet('<div class="sheet-head"><h2>' + title + '</h2><button class="x" data-x>×</button></div>' +
      '<div style="text-align:center"><div style="width:84px;margin:0 auto">' + mascot('think') + '</div><div class="small b muted" style="margin:6px 0 12px">' + sub + '</div></div>' +
      '<div class="pinbox">' + [0, 1, 2, 3].map(i => '<input type="password" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="off" data-i="' + i + '">').join('') + '</div>', () => { if (!done) res(null); });
    const ins = Array.from(el.querySelectorAll('.pinbox input'));
    el.querySelector('[data-x]').onclick = () => closeSheet();
    setTimeout(() => ins[0].focus(), 250);
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(-1);
        if (inp.value && i < 3) ins[i + 1].focus();
        const pin = ins.map(x => x.value).join('');
        if (pin.length === 4) { done = true; setTimeout(() => { closeSheet(); res(pin); }, 100); }
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && i > 0) ins[i - 1].focus(); });
    });
  });
}
async function unlockOwner() {
  if (!navigator.onLine && !DEMO) { toast(L('Kailangan ng internet para i-check ang PIN', 'Need internet to check the PIN'), 'think'); return; }
  const pin = await askPin('🔑 Owner PIN', L('Ilagay ang 4-digit PIN ng Owner', "Enter the owner's 4-digit PIN"));
  if (!pin) return;
  const h = await pinHash(pin);
  try {
    const j = await api('verifyPin', { pinHash: h });
    if (j.locked) { toast(L('Maraming maling subok. Subukan ulit after 15 minuto.', 'Too many wrong tries. Try again in 15 minutes.'), 'sad'); return; }
    if (!j.valid) { toast(L('Mali ang PIN', 'Wrong PIN'), 'sad'); return; }
    LS.set(K('pin'), h); LS.set(K('owner'), true);
    flush(true); render(); loadLog(); toast(L('Owner mode na! 👑', 'Owner mode on! 👑'), 'cheer');
  } catch (e) { toast(L('Hindi ma-check ngayon. Subukan ulit.', "Couldn't check right now. Try again."), 'sad'); }
}
async function createPinFlow(firstTime, change) {
  if (!navigator.onLine && !DEMO) { toast(L('Kailangan ng internet', 'Internet needed'), 'think'); return; }
  const p1 = await askPin(change ? L('Bagong PIN', 'New PIN') : L('Gumawa ng Owner PIN', 'Create Owner PIN'), L('4 na numero. Tandaan mo ito!', '4 digits. Remember it!'));
  if (!p1) return;
  const p2 = await askPin(L('Ulitin ang PIN', 'Repeat the PIN'), L('I-type ulit para sigurado', 'Type it again to confirm'));
  if (!p2) return;
  if (p1 !== p2) { toast(L('Hindi magkapareho. Subukan ulit.', "They didn't match. Try again."), 'sad'); return; }
  const h = await pinHash(p1);
  try {
    const j = await api('setPin', { pinHash: h, oldPinHash: pinKey(), by: myName() });
    LS.set(K('pin'), h); LS.set(K('owner'), true);
    applyServer(j); await saveCache(); render();
    toast(L('Naka-set na ang PIN! 👑', 'PIN saved! 👑'), 'cheer');
  } catch (e) {
    toast(String(e.message).includes('PIN_EXISTS') ? L('May PIN na. Gamitin ang "Ako ang Owner".', 'A PIN already exists. Use "I\'m the Owner".') : L('Hindi na-save. Subukan ulit.', "Couldn't save. Try again."), 'sad');
  }
}

function screen(html) {
  const el = document.createElement('div'); el.className = 'screen'; el.innerHTML = '<div class="inner">' + html + '</div>';
  document.body.appendChild(el); return el;
}
function carryParams() {
  // iPhone keeps Safari and the Home Screen app separate — remember progress in the link
  if (isStandalone()) return;
  const p = new URLSearchParams(); p.set('id', CODE);
  if (myName()) p.set('n', myName());
  if (LS.get(K('tour'), false)) p.set('t', '1');
  if (isOwnerDevice()) p.set('o', '1');
  if (LS.get(K('lang'), null)) p.set('l', LANG);
  if (termsOk()) p.set('a', String(TERMS_V));
  try { history.replaceState(null, '', location.pathname + '?' + p.toString()); } catch (e) { }
}
function readCarried() {
  if (!isStandalone()) return;
  if (qs.get('n') && !LS.get(K('name'), '')) LS.set(K('name'), qs.get('n'));
  if (qs.get('t') === '1') LS.set(K('tour'), true);
  if (+qs.get('a') >= TERMS_V && !termsOk()) { LS.set(K('terms'), +qs.get('a')); LS.set(K('termsAt'), nowIso()); }
  if (qs.get('o') === '1') LS.set(K('owner'), true);
  if (qs.get('l') && !LS.get(K('lang'), null)) { LS.set(K('lang'), qs.get('l')); LANG = qs.get('l'); }
  if (LS.get(K('name'), '')) LS.set(K('inst'), true);
}

let tourActive = false;
function tourSteps(kind) {
  const full = [
    { sel: '#scanBar', tl: 'Dito ang <b>search</b>. I-type ang pangalan o barcode ng paninda. Kung may Bluetooth scanner ka, mag-scan lang kahit saan!', en: 'This is <b>search</b>. Type an item name or barcode. With a Bluetooth scanner, just scan anytime!' },
