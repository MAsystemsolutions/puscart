    { sel: '#payBar', tl: 'Ang <b>kabuuan</b>. Pindutin ang <b>Bayad →</b> at ako na ang magkukuwenta ng sukli! 🐱', en: 'The <b>total</b>. Tap <b>Pay →</b> and I\'ll work out the change! 🐱' },
    { sel: '#nav-items', tl: 'Sa <b>Paninda</b>: magdagdag ng paninda (i-scan ang barcode), tingnan ang stock, at ilista ang dumating na delivery.', en: '<b>Items</b>: add items (scan the barcode), see stock, and record deliveries.' },
    { sel: '#nav-sales', tl: 'Sa <b>Listahan</b> makikita lahat ng benta at resibo.', en: '<b>Sales</b> shows every sale and receipt.' },
    { sel: '#nav-report', tl: 'Sa <b>Ulat</b>: kita, tubo, pinakamabenta, at paubos na. Ikaw lang ang nakakakita nito.', en: '<b>Reports</b>: sales, profit, best sellers and low stock. Only you can see this.', skipIf: () => !isOwner() },
    { sel: '#nav-help', tl: 'May tanong? Pindutin ang <b>Tulong</b>.', en: 'Questions? Tap <b>Help</b>.', skipIf: () => isOwner() },
    { sel: '#syncBadge', tl: 'Kahit walang internet, tuloy ang benta. Kusa itong magsi-sync mamaya.', en: 'No internet? Keep selling. It syncs by itself later.' },
    { sel: '#btn-bell', tl: '🔔 Dito ka aabisuhan kapag nagpalit ng presyo, nag-void, o nag-ayos ng stock ang staff.', en: '🔔 You get notified here when staff change prices, void sales, or fix stock.', skipIf: () => !isOwner() },
    { sel: '#btn-settings', tl: 'Sa Settings: wika, paraan ng bayad, scanner test, o <b>ulitin ang tutorial</b>.', en: 'Settings: language, payment methods, scanner test, or <b>replay this tutorial</b>.' }
  ];
  if (kind === 'full') return full;
  return full.filter(s => ['#scanBar', '#camBtn', '#cartBox', '#payBar', '#nav-items', '#nav-help'].includes(s.sel));
}
function runTour(kind) {
  return new Promise(resolve => {
    const steps = tourSteps(kind).filter(s => !(s.skipIf && s.skipIf()));
    let i = 0, target = null;
    tourActive = true;
    const blks = [0, 1, 2, 3, 4].map(() => { const b = document.createElement('div'); b.className = 'blk'; document.body.appendChild(b); return b; });
    const ring = document.createElement('div'); ring.className = 'ring';
    const coach = document.createElement('div'); coach.className = 'coach';
    document.body.append(ring, coach);
    const blockTap = ev => { ev.preventDefault(); ev.stopPropagation(); };
    blks.forEach(b => { b.addEventListener('click', blockTap, true); b.addEventListener('touchstart', blockTap, { passive: false }); });
    const end = () => {
      tourActive = false;
      blks.forEach(b => b.remove()); ring.remove(); coach.remove();
      window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
      LS.set(K('tour'), true); carryParams();
      toast(L('Handa ka na, Bossing! Pindot. Benta. Meow! 🎉', "You're all set! Tap. Sell. Meow! 🎉"), 'cheer');
      resolve();
    };
    function place() {
      if (!target) return;
      const r = target.getBoundingClientRect(), p = 6;
      const x = Math.max(0, r.left - p), y = Math.max(0, r.top - p), w = Math.min(innerWidth, r.width + p * 2), h = r.height + p * 2;
      const vw = innerWidth, vh = innerHeight;
      Object.assign(ring.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      Object.assign(blks[0].style, { left: 0, top: 0, width: vw + 'px', height: y + 'px' });
      Object.assign(blks[1].style, { left: 0, top: (y + h) + 'px', width: vw + 'px', height: Math.max(0, vh - y - h) + 'px' });
      Object.assign(blks[2].style, { left: 0, top: y + 'px', width: x + 'px', height: h + 'px' });
      Object.assign(blks[3].style, { left: (x + w) + 'px', top: y + 'px', width: Math.max(0, vw - x - w) + 'px', height: h + 'px' });
      Object.assign(blks[4].style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      const ch = coach.offsetHeight || 120;
      const above = y - ch - 16 > 10, below = y + h + 16 + ch < vh - 10;
      let top;
      if (y + h / 2 > vh / 2 && above) top = y - ch - 16; else if (below) top = y + h + 16; else top = Math.max(10, y - ch - 16);
      coach.style.top = Math.max(10, Math.min(top, vh - ch - 10)) + 'px';
    }
    function show() {
      if (i >= steps.length) return end();
      const s = steps[i];
      let tries = 0;
      const find = () => {
        target = document.querySelector(s.sel);
        if (!target || (target.offsetParent === null && getComputedStyle(target).position !== 'fixed')) {
          if (tries++ < 15) return setTimeout(find, 80);
          i++; return show();
        }
        const r = target.getBoundingClientRect();
        if (r.top < 70 || r.bottom > innerHeight - 90) target.scrollIntoView({ block: 'center', behavior: 'instant' });
        coach.innerHTML = '<div class="m">' + mascot('hello') + '</div><div style="flex:1"><div class="stepn">' + (i + 1) + ' / ' + steps.length + '</div><div class="txt">' + s[LANG] + '</div><div class="act">' +
          '<button class="go">' + (i === steps.length - 1 ? L('Tapos! 🎉', 'Done! 🎉') : L('Sige →', 'Next →')) + '</button><button class="skip">' + L('Laktawan', 'Skip') + '</button></div></div>';
        coach.querySelector('.go').onclick = () => { i++; show(); };
        coach.querySelector('.skip').onclick = end;
        requestAnimationFrame(place); setTimeout(place, 250);
      };
      find();
    }
    window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
    show();
  });
}

/* =================================================================
   BOOT
   ================================================================= */
async function boot() {
  const hideSplash = () => { const sp = $('#splash'); if (sp) { sp.style.opacity = 0; setTimeout(() => sp.remove(), 200); } };
  if (DEMO) $('#demoChip').classList.remove('hidden');
  if (!CODE) { hideSplash(); gate('think', L('Kailangan ang link mo', 'You need your personal link'), L('Buksan ang Puscart gamit ang link na ibinigay sa iyo.', 'Open Puscart using the link you were given.')); return; }
  readCarried();
  const hadCache = await loadCache();
  if (S.settings && !LS.get(K('lang'), null) && S.settings.lang) LANG = S.settings.lang;
  document.documentElement.lang = LANG === 'tl' ? 'tl' : 'en';
  if (hadCache && S.settings) { showApp(); hideSplash(); }
  let fresh = false;
  if (navigator.onLine || DEMO) {
    try {
      const sending = S.ops.slice();
      const j = sending.length ? await api('sync', { ops: sending, pin: pinKey() }) : await api('init', { pin: pinKey() });
      if (sending.length) { const sent = new Set(sending.map(o => o.uid)); S.ops = S.ops.filter(o => !sent.has(o.uid)); DB.set(K('ops'), S.ops); }
      applyServer(j); await saveCache(); fresh = true;
    } catch (e) { console.warn(e); }
  }
  if (S.settings && !LS.get(K('lang'), null) && S.settings.lang) LANG = S.settings.lang;
  hideSplash();
  if (gateCheck()) return;
  if (!S.settings && !fresh) { gate('think', L('Kailangan ng internet', 'Internet needed'), L('Sa unang bukas, kailangan ng internet. Pagkatapos nito, gagana na kahit offline!', 'The very first time needs internet. After that it works offline too!'), L('Subukan ulit', 'Try again')); return; }
  if (!fresh && S.lastOk && Date.now() - S.lastOk > S.grace * 86400000) { gate('think', L('Kumonekta sa internet', 'Please connect to the internet'), L('Matagal ka nang offline. Kumonekta saglit para ma-sync ang benta.', "You've been offline a long time. Connect briefly to sync your sales."), L('Subukan ulit', 'Try again')); return; }
  if (!termsOk()) await termsGate();
  if (needInstallGuide()) await installGuide(false);
  if (!S.settings) await setupWizard();
  if (!myName()) await askName(false);
  carryParams();
  if (S.pinSet === false && isOwnerDevice() && (navigator.onLine || DEMO)) { showApp(); await createPinFlow(true); }
  showApp();
  if (!LS.get(K('tour'), false)) { go('sell'); await new Promise(r => setTimeout(r, 300)); await runTour(isOwner() || isOwnerDevice() ? 'full' : 'short'); }
  flush(); loadLog();
}
let appShown = false;
function showApp() {
  $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  if (!appShown) {
    appShown = true;
    $$('.nav button[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
    $('#btn-settings').onclick = () => go('settings');
    $('#btn-bell').onclick = () => { go('alerts'); loadLog(); };
    $('#syncBadge').onclick = () => flush(true);
    $('#pb-pay').onclick = () => openPay();
    $('#pb-clear').onclick = async () => { if (await confirmSheet('🗑️ ' + L('Alisin lahat?', 'Clear the cart?'), L('Aalisin ang lahat ng nasa cart.', 'Everything in the cart will be removed.'), L('Alisin', 'Clear'), true)) { S.cart = []; saveCart(); renderCart(); } };
  }
  go(S.view || 'sell');
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();
</script>
